name: Build and Publish

on:
  push:
    branches: main
    tags: ['v*']
  pull_request:

permissions:
  contents: write

jobs:
  build:
    name: Build and create release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      
      - name: Fetch Unity Engine modules
        run: |
          wget https://files.catbox.moe/i4sdl6.zip -O UnityModules.zip
          unzip UnityModules.zip -d References

      - name: Fetch API files
        run: |
          wget https://github.com/hk-modding/api/releases/latest/download/moddingapi.v77.windows.zip -O API.zip
          unzip -o API.zip -d References

      - name: Fetch mod dependencies
        run: |
          fetch() { mkdir -p "References/Mods/$1" && wget -q "$2" -O dep.zip && unzip -o dep.zip -d "References/Mods/$1" && rm dep.zip; }
          fetch "ItemChanger"          "https://github.com/homothetyhk/HollowKnight.ItemChanger/releases/download/v2.1.6%2B927/ItemChanger.zip"
          fetch "MenuChanger"          "https://github.com/homothetyhk/HollowKnight.MenuChanger/releases/download/v1.1.0%2B132/MenuChanger.zip"
          fetch "MapChanger"           "https://github.com/syyePhenomenol/MapChanger/releases/download/v1.3.11/MapChanger.zip"
          fetch "RandomizerCore"       "https://github.com/homothetyhk/RandomizerCore/releases/download/v2.1.2/RandomizerCore.zip"
          fetch "Randomizer 4"         "https://github.com/homothetyhk/RandomizerMod/releases/download/v4.1.6%2B987/RandomizerMod.zip"
          fetch "RandoSettingsManager" "https://github.com/BadMagic100/RandoSettingsManager/releases/download/v1.2.8489.20/RandoSettingsManager.zip"

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Build project
        run: dotnet build --configuration Release

      - name: Get SHA256 of zipped mod
        id: get_hash
        run: echo "hash=$(sha256sum Output/ItemReveal.zip | cut -d ' ' -f 1)" >> "$GITHUB_OUTPUT"

      - name: Get Assembly version
        id: get_version
        run: echo "version=$(tr -dc '0-9.' < Version.txt)" >> "$GITHUB_OUTPUT"

      - name: Create release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          name: Release ${{ github.ref_name }}
          body: "SHA256: ${{ steps.get_hash.outputs.hash }}"
          files: Output/ItemReveal.zip
          draft: false
          prerelease: false